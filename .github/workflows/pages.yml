name: Deploy playground
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  PUPPETEER_SKIP_DOWNLOAD: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/playground
      # The comparison gallery is rendered here with Inter installed, so label measurements match the font it displays.
      - run: sudo apt-get update && sudo apt-get install -y fonts-inter
      - name: Build comparison gallery
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node scripts/render-examples.mjs
          OUT=apps/playground/dist/gallery/index.html node scripts/build-gallery.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/playground/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
