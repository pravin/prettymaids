<svg id="stock" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608.640625 450" style="max-width: 608.640625px;" role="graphics-document document" aria-roledescription="pie"><style>#stock{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#stock .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#stock .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#stock .error-icon{fill:#552222;}#stock .error-text{fill:#552222;stroke:#552222;}#stock .edge-thickness-normal{stroke-width:1px;}#stock .edge-thickness-thick{stroke-width:3.5px;}#stock .edge-pattern-solid{stroke-dasharray:0;}#stock .edge-thickness-invisible{stroke-width:0;fill:none;}#stock .edge-pattern-dashed{stroke-dasharray:3;}#stock .edge-pattern-dotted{stroke-dasharray:2;}#stock .marker{fill:#333333;stroke:#333333;}#stock .marker.cross{stroke:#333333;}#stock svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#stock p{margin:0;}#stock .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#stock .pieCircle.highlighted{scale:1.05;opacity:1;}#stock .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#stock .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#stock .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#stock .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#stock .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#stock .node .neo-node{stroke:#9370DB;}#stock [data-look="neo"].node rect,#stock [data-look="neo"].cluster rect,#stock [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#stock [data-look="neo"].swimlane.cluster rect{filter:none;}#stock [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#stock [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#stock [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#stock [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#stock [data-look="neo"].node circle .state-start{fill:#000000;}#stock [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#stock [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#stock :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,89.124,162.117L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M89.124,162.117A185,185,0,0,1,-149.668,108.74L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-149.668,108.74A185,185,0,0,1,-172.009,-68.103L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><path d="M-172.009,-68.103A185,185,0,0,1,-78.769,-167.393L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"></path><path d="M-78.769,-167.393A185,185,0,0,1,0,-185L0,0Z" fill="hsl(60, 100%, 63.5294117647%)" class="pieCircle"></path><text transform="translate(134.39091360659756,-34.505721844123585)" class="slice" style="text-anchor: middle;">42%</text><text transform="translate(-30.26737474377028,135.4084507190012)" class="slice" style="text-anchor: middle;">23%</text><text transform="translate(-137.6559148073838,17.389986157047254)" class="slice" style="text-anchor: middle;">16%</text><text transform="translate(-101.14439705472093,-94.98091094760547)" class="slice" style="text-anchor: middle;">12%</text><text transform="translate(-30.26737474377037,-135.