  <body>
    <header>
      <h1>prettymaids</h1>
      <div class="controls">
        <label>Example <select id="example"></select></label>
        <label>Theme <select id="theme"></select></label>
        <a id="gallery-link" href="./gallery/">Gallery</a>
        <button id="reset">Reset tuning</button>
        <button id="copy-params">Copy params</button>
        <button id="copy">Copy SVG</button>
        <button id="dl-svg">Download SVG</button>
        <button id="dl-png">Download PNG</button>
      </div>
    </header>
    <main>
      <section class="pane">
        <h2>Mermaid source</h2>
        <textarea id="source" spellcheck="false"></textarea>
        <div id="error" role="alert"></div>
      </section>
      <section class="pane">
        <h2>Preview</h2>
        <div id="preview"></div>
      </section>
      <aside class="pane" id="tuning-pane">
        <h2>Tuning</h2>
        <div id="tuning"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
